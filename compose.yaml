# robo-fechamento/compose.yaml
# PostgreSQL local para rodar o robô contra um banco real (dados sintéticos).
# Subir:  docker compose up -d
# Depois: LEDGER_DATABASE_URL=postgresql+psycopg://ledger:sintetica@127.0.0.1:5434/ledger
services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: sintetica   # banco descartável, só dados sintéticos
    ports:
      - "127.0.0.1:5434:5432"        # só na máquina local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledger"]
      interval: 3s
      retries: 20
